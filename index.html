<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>histARy - AR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #111111;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1c1c1e;
      border: 1px solid #3a3a3c;
      border-radius: 20px;
      padding: 30px 20px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { font-size: 22px; margin-bottom: 8px; color: #f4f1ea; }
    p { font-size: 14px; color: #a1a1a6; margin-bottom: 25px; line-height: 1.4; }
    
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      margin-bottom: 12px;
      border: none;
      cursor: pointer;
    }
    .btn-ios { background-color: #007aff; color: #ffffff; }
    .btn-android { background-color: #704214; color: #ffffff; }
    
    #status {
      margin-top: 15px;
      font-size: 13px;
      color: #ffd60a;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🏛️ Pałac w Mokrem</h1>
    <p>Wybierz przycisk odpowiadający Twojemu systemowi, aby wygenerować model 3D w przestrzeni.</p>

    <!-- Przycisk iOS (Apple AR Quick Look) – widoczny zawsze w czystym HTML -->
    <!-- Upewnij się, że plik palac.usdz znajduje się na GitHubie! -->
    <a class="btn btn-ios" rel="ar" href="palac.usdz">
      📍 Otwórz w AR (iPhone / iOS)
    </a>

    <!-- Przycisk dla Androida -->
    <button id="start-android" class="btn btn-android">
      🤖 Otwórz w AR (Android)
    </button>

    <div id="status"></div>
  </div>

  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const androidBtn = document.getElementById('start-android');
    const statusDiv = document.getElementById('status');

    if (isIOS) {
      // Na iOS ukrywamy przycisk Androida, zostawiamy natywny link .usdz
      androidBtn.style.display = 'none';
      statusDiv.innerHTML = "Stuknij niebieski przycisk, aby wywołać Apple AR.";
    } else {
      // Na Androidzie przypisujemy uruchomienie silnika Three.js pod brązowy przycisk
      androidBtn.addEventListener('click', () => {
        androidBtn.style.display = 'none';
        statusDiv.innerHTML = "⏳ Uruchamianie aparatu i pobieranie modelu...";
        initAndroidAR();
      });
    }

    function initAndroidAR() {
      import('three').then(THREE => {
        Promise.all([
          import('three/addons/webxr/ARButton.js'),
          import('three/addons/loaders/GLTFLoader.js')
        ]).then(([ {ARButton}, {GLTFLoader} ]) => {
          
          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

          const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
          scene.add(ambientLight);
          const dirLight = new THREE.DirectionalLight(0xffffff, 2);
          dirLight.position.set(5, 10, 7);
          scene.add(dirLight);

          const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          renderer.setPixelRatio(window.devicePixelRatio);
          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.xr.enabled = true;
          document.body.appendChild(renderer.domElement);

          const arButton = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] });
          document.body.appendChild(arButton);
          arButton.click(); // Automatyczny start sesji AR

          let loadedModel = null;
          let reticle = null;
          let hitTestSource = null;
          let hitTestSourceRequested = false;

          const loader = new GLTFLoader();
          loader.load(
            'palac.glb',
            (gltf) => {
              loadedModel = gltf.scene;
              loadedModel.scale.set(1, 1, 1);
              statusDiv.innerHTML = "✅ Model wczytany! Skanuj podłogę i kliknij celownik.";
            },
            (xhr) => {
              if (xhr.lengthComputable) {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                statusDiv.innerHTML = `⏳ Pobieranie pliku GLB: ${percent}%`;
              }
            },
            (err) => {
              statusDiv.innerHTML = "❌ Błąd: Brak pliku palac.glb na GitHubie!";
            }
          );

          const controller = renderer.xr.getController(0);
          controller.addEventListener('select', () => {
            if (reticle && reticle.visible && loadedModel) {
              const instance = loadedModel.clone();
              instance.position.setFromMatrixPosition(reticle.matrix);
              scene.add(instance);
              statusDiv.style.display = 'none';
            }
          });
          scene.add(controller);

          const geometry = new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2);
          const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
          reticle = new THREE.Mesh(geometry, material);
          reticle.matrixAutoUpdate = false;
          reticle.visible = false;
          scene.add(reticle);

          renderer.setAnimationLoop((timestamp, frame) => {
            if (frame) {
              const refSpace = renderer.xr.getReferenceSpace();
              const session = renderer.xr.getSession();

              if (!hitTestSourceRequested) {
                session.requestReferenceSpace('viewer').then((viewerSpace) => {
                  session.requestHitTestSource({ space: viewerSpace }).then((source) => { hitTestSource = source; });
                });
                session.addEventListener('end', () => { hitTestSourceRequested = false; hitTestSource = null; });
                hitTestSourceRequested = true;
              }

              if (hitTestSource) {
                const results = frame.getHitTestResults(hitTestSource);
                if (results.length > 0) {
                  reticle.visible = true;
                  reticle.matrix.fromArray(results[0].getPose(refSpace).transform.matrix);
                } else {
                  reticle.visible = false;
                }
              }
            }
            renderer.render(scene, camera);
          });

        });
      });
    }
  </script>
</body>
</html>
