<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>histARy - AR</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; }
    
    /* Styl dla Androida (Three.js) */
    #android-ui { display: none; position: absolute; top: 10%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 15px 25px; border-radius: 10px; text-align: center; z-index: 10; width: 80%; }
    
    /* Styl dla iPhone (Natywne AR Apple) */
    #ios-ui { display: none; text-align: center; flex-direction: column; align-items: center; }
    .ios-btn { background: #007AFF; color: white; padding: 16px 32px; border-radius: 30px; text-decoration: none; font-size: 18px; font-weight: bold; margin-top: 20px; display: inline-flex; align-items: center; gap: 10px; }
    .ios-text { opacity: 0.8; font-size: 16px; max-width: 80%; margin: 0 auto; line-height: 1.5; }
  </style>
</head>
<body>
  
  <!-- Interfejs dla Androida -->
  <div id="android-ui">Zeskanuj podłogę telefonem.<br>Kiedy pojawi się kółko, kliknij ekran.</div>
  
  <!-- Interfejs dla iPhone -->
  <div id="ios-ui">
    <div class="ios-text">Twój system (iOS) wymaga uruchomienia modelu w natywnym środowisku Apple AR.</div>
    <!-- UWAGA: Zmień href na dokładną nazwę swojego pliku .usdz na serwerze! -->
    <a class="ios-btn" rel="ar" href="palac.usdz">
      📍 Umieść model w przestrzeni
    </a>
  </div>

  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    // Sprawdzamy czy użytkownik korzysta z systemu iOS (iPhone / iPad)
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (isIOS) {
      // Dla iPhone: pokazujemy przycisk AR Quick Look (wczyta plik .usdz z atrybutu href w linku)
      document.getElementById('ios-ui').style.display = 'flex';
    } else {
      // Dla Androida: pokazujemy ukryty dotąd interfejs i ładujemy Three.js WebXR
      document.getElementById('android-ui').style.display = 'block';
      initThreeJS();
    }

    function initThreeJS() {
      // Importujemy ciężkie moduły tylko wtedy, gdy jesteśmy na Androidzie, by nie zawieszać Safari
      import('three').then(THREE => {
        Promise.all([
          import('three/addons/webxr/ARButton.js'),
          import('three/addons/loaders/GLTFLoader.js')
        ]).then(([ {ARButton}, {GLTFLoader} ]) => {
          
          let container, camera, scene, renderer, controller, reticle;
          let hitTestSource = null;
          let hitTestSourceRequested = false;
          let loadedModel = null;

          container = document.createElement('div');
          document.body.appendChild(container);

          scene = new THREE.Scene();
          camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

          const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
          light.position.set(0.5, 1, 0.25);
          scene.add(light);

          renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          renderer.setPixelRatio(window.devicePixelRatio);
          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.xr.enabled = true;
          container.appendChild(renderer.domElement);

          document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

          // UWAGA: Zmień nazwę na swój plik .glb dla Androida
         const loader = new GLTFLoader();

// UWAGA: Nazwa w cudzysłowie musi zgadzać się co do wielkości liter z plikiem na GitHubie!
loader.load(
  'palac.glb',
  function (gltf) {
    loadedModel = gltf.scene;
    // Domyślne skalowanie - jeśli po załadowaniu nie widać modelu, zmień na (1, 1, 1)
    loadedModel.scale.set(0.1, 0.1, 0.1); 
    
    // Komunikat informujący, że model jest w pamięci i czeka na tapnięcie
    const overlay = document.getElementById('android-ui');
    if (overlay) overlay.innerHTML = "✅ Model wczytany!<br>Zeskanuj podłogę i kliknij ekran.";
  },
  undefined,
  function (error) {
    console.error('Błąd ładowania GLB:', error);
    const overlay = document.getElementById('android-ui');
    if (overlay) overlay.innerHTML = "❌ Błąd: Nie znaleziono pliku palac.glb na serwerze!";
  }
);

          function onSelect() {
            if (reticle.visible && loadedModel) {
              const clone = loadedModel.clone();
              clone.position.setFromMatrixPosition(reticle.matrix);
              clone.quaternion.setFromRotationMatrix(reticle.matrix);
              scene.add(clone);
              document.getElementById('android-ui').style.display = 'none';
            }
          }

          controller = renderer.xr.getController(0);
          controller.addEventListener('select', onSelect);
          scene.add(controller);

          const geometry = new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2);
          const material = new THREE.MeshBasicMaterial();
          reticle = new THREE.Mesh(geometry, material);
          reticle.matrixAutoUpdate = false;
          reticle.visible = false;
          scene.add(reticle);

          window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
          });

          renderer.setAnimationLoop((timestamp, frame) => {
            if (frame) {
              const referenceSpace = renderer.xr.getReferenceSpace();
              const session = renderer.xr.getSession();

              if (hitTestSourceRequested === false) {
                session.requestReferenceSpace('viewer').then(function (referenceSpace) {
                  session.requestHitTestSource({ space: referenceSpace }).then(function (source) { hitTestSource = source; });
                });
                session.addEventListener('end', function () { hitTestSourceRequested = false; hitTestSource = null; });
                hitTestSourceRequested = true;
              }

              if (hitTestSource) {
                const hitTestResults = frame.getHitTestResults(hitTestSource);
                if (hitTestResults.length > 0) {
                  const hit = hitTestResults[0];
                  reticle.visible = true;
                  reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                } else {
                  reticle.visible = false;
                }
              }
            }
            renderer.render(scene, camera);
          });

        });
      });
    }
  </script>
</body>
</html>
